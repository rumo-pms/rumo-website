<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign your contract · rumo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1B1917; --ink-soft:#3a3531; --paper:#F5EEE2; --paper-panel:#FAF5EA;
    --sand:#E3D8C3; --muted:#8d8378; --terra:#D68F6F; --terra-dark:#b96b4a; --border:#E3D8C3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .sign-wrap { max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
  .sign-brand { font-family: 'Fraunces', Georgia, serif; font-size: 1.9rem; font-weight: 500; letter-spacing: -0.03em; color: var(--ink); }
  .sign-brand em { color: var(--terra-dark); font-style: normal; }
  .sign-lead { font-size: 1.05rem; line-height: 1.55; color: var(--ink-soft); margin: 1.1rem 0 0.3rem; max-width: 34rem; }
  .sign-aside { font-family: 'Caveat', cursive; font-size: 1.15rem; color: var(--terra-dark); margin: 0 0 2.2rem; }

  .sign-doc { background: var(--paper-panel); border: 1px solid var(--sand); border-radius: 16px; padding: 1.9rem 2.1rem; max-height: 56vh; overflow-y: auto; margin-bottom: 1.75rem; }
  .sign-doc h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.35rem; margin: 1.9rem 0 0.7rem; color: var(--ink); }
  .sign-doc h2:first-child { margin-top: 0; }
  .sign-doc h3 { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem; margin: 1.3rem 0 0.35rem; color: var(--ink); }
  .sign-doc p { line-height: 1.65; margin: 0 0 0.9rem; font-size: 0.93rem; color: var(--ink-soft); }
  .sign-doc ul { margin: 0 0 0.9rem 1.2rem; line-height: 1.65; font-size: 0.93rem; color: var(--ink-soft); }
  .sign-doc hr { border: none; border-top: 1px solid var(--sand); margin: 1.6rem 0; }
  .sign-doc table { width: 100%; border-collapse: collapse; margin: 0.6rem 0 1.2rem; font-size: 0.86rem; }
  .sign-doc th, .sign-doc td { border: 1px solid var(--sand); padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
  .sign-doc th { background: rgba(0,0,0,0.03); font-weight: 600; }

  .sign-form { display: flex; flex-direction: column; gap: 1rem; max-width: 30rem; }
  .sign-form label { font-size: 0.9rem; font-weight: 600; color: var(--ink); display: flex; flex-direction: column; gap: 0.35rem; }
  .sign-form input[type=text], .sign-form input[type=email] {
    font: inherit; font-size: 0.98rem; font-weight: 400; padding: 0.65rem 0.85rem;
    border: 1px solid var(--sand); border-radius: 11px; background: #fff; color: var(--ink);
  }
  .sign-form input:focus { outline: none; border-color: var(--terra); box-shadow: 0 0 0 3px rgba(214,143,111,0.2); }
  .sig-pad { position: relative; border: 1px solid var(--sand); border-radius: 11px; background: #fff; }
  .sig-pad canvas { display: block; width: 100%; height: 150px; border-radius: 11px; touch-action: none; cursor: crosshair; }
  .sig-pad-hint { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; pointer-events: none; }
  .sig-clear { align-self: flex-start; background: none; border: none; color: var(--terra-dark); font: inherit; font-size: 0.82rem; cursor: pointer; padding: 0; margin-top: 0.35rem; }
  .sign-check { flex-direction: row !important; align-items: flex-start; gap: 0.6rem !important; font-weight: 400 !important; font-size: 0.92rem; line-height: 1.5; color: var(--ink-soft); }
  .sign-check input { margin-top: 0.2rem; width: 1rem; height: 1rem; accent-color: var(--terra-dark); }
  #sign-btn {
    align-self: flex-start; background: var(--ink); color: var(--paper); border: none; border-radius: 999px;
    padding: 0.8rem 1.9rem; font: inherit; font-size: 0.98rem; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.15s;
  }
  #sign-btn:hover:not(:disabled) { background: var(--terra-dark); transform: translateY(-1px); }
  #sign-btn:disabled { opacity: 0.5; cursor: default; }
  .sign-err { color: #b0413e; font-size: 0.88rem; }

  .sign-notice { background: var(--paper-panel); border: 1px solid var(--sand); border-radius: 16px; padding: 2.5rem; text-align: center; }
  .sign-notice h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.6rem; margin: 0 0 0.6rem; }
  .sign-notice.ok h2 { color: var(--terra-dark); }
  .sign-notice p { color: var(--ink-soft); line-height: 1.6; margin: 0; }
  .sign-notice.err { color: #b0413e; }
  .sign-loading { color: var(--muted); }
  .sign-foot { margin-top: 3rem; font-size: 0.78rem; color: var(--muted); }
  .sign-foot a { color: var(--terra-dark); }
</style>
</head>
<body>
<div class="sign-wrap">
  <div class="sign-brand">rumo<em>.</em></div>
  <p class="sign-lead">Your contract is ready. Read it through at your own pace and sign digitally.</p>
  <div id="sign-app"></div>
  <p class="sign-foot">Rumo Works BV · Koningin Elisabethlaan 3, 9000 Ghent · <a href="mailto:hello@rumo.eu">hello@rumo.eu</a></p>
</div>
<script src="../sign.js"></script>
</body>
</html>
